name: Build Web Database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/build_web_database.py"
      - ".github/workflows/build-web-database.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build indexed web data
        run: python3 scripts/build_web_database.py
      - name: Validate generated manifest
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("web/manifest.json",encoding="utf-8"))
          expected={"players":6438,"clubs":402,"associations":13,"tournaments":2633,"results":27501,"rounds":114777,"drl":213155,"dmv":156744}
          assert m["counts"]==expected, (m["counts"], expected)
          assert m["status"]=="web_database_build_verified"
          print("WEB DATABASE VALIDATION OK")
          print(m["counts"])
          PY
